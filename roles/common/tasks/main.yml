---
- name: Create service group
  ansible.builtin.group:
    name: "{{ service_user }}"
    gid: "{{ service_gid }}"
    system: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    uid: "{{ service_uid }}"
    group: "{{ service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent

- name: Create vm-infra config directory
  ansible.builtin.file:
    path: /etc/vm-infra
    state: directory
    owner: root
    group: root
    mode: "0755"
