---
- name: Create service group
  ansible.builtin.group:
    name: "{{ service_user }}"
    gid: "{{ service_gid }}"
    system: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    uid: "{{ service_uid }}"
    group: "{{ service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent

- name: Create vm-infra config directory
  ansible.builtin.file:
    path: /etc/vm-infra
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Recreate the deploy lock file at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/vm-infra.conf
    content: "f {{ deploy_lock_file }} 0644 root root -\n"
    owner: root
    group: root
    mode: "0644"

- name: Create the deploy lock file
  ansible.builtin.file:
    path: "{{ deploy_lock_file }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
